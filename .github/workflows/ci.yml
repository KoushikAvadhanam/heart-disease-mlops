name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 src test
      - name: Unit tests
        run: pytest -v --junitxml=test-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.xml

  train:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download dataset
        run: python src/download_data.py
      - name: Train models
        run: python src/train.py
      - name: Upload model and training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/
            artifacts/
            mlruns/

  docker:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
      - name: Build image
        run: docker build -t heart-api:ci .
      - name: Run container and smoke test
        run: |
          docker run -d --name heart -p 8000:8000 heart-api:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
      - name: Show container logs
        if: always()
        run: docker logs heart
